<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Wochenkalender</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24362c;background:#e9eee9}*{box-sizing:border-box}body{margin:0;padding:16px}header{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #a6b9a9;background:white;border-radius:9px;padding:9px 12px;color:#254b35}button.primary{background:#315d45;color:white}h1{font-size:23px;margin:0}small{color:#607367}.book{max-width:1250px;margin:14px auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#b5bcb4;padding:5px;border-radius:10px;box-shadow:0 6px 25px #24362c22}.page{background:#fffefa;padding:14px;min-height:670px;display:flex;flex-direction:column;gap:7px}.day{border:1px solid #e3e6df;border-radius:5px;flex:1;min-height:138px;padding:7px;background:repeating-linear-gradient(to bottom,#fffefa 0px,#fffefa 31px,#dce2dc 32px);cursor:pointer}.day:hover{outline:2px solid #8eaf97}.day strong{background:#fffefa;padding:2px 7px 2px 0}.day .event{display:block;background:#e2f0e5;border-left:3px solid #528164;margin:5px 0;padding:4px 5px;font-size:12px;line-height:1.3;overflow-wrap:anywhere}.day .event:nth-child(odd){background:#f4e9df;border-color:#b68a67}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.shade{position:fixed;inset:0;background:#18261bb8;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.shade.open{display:flex}.panel{background:white;border-radius:15px;padding:20px;width:min(540px,100%);max-height:92vh;overflow:auto}.panel h2{margin-top:0}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field input,.field textarea,.field select{border:1px solid #bac8bc;border-radius:7px;padding:9px;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.entry{padding:9px;background:#edf3ee;border-radius:8px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.check{display:block;margin:8px 0}.muted{color:#617168;font-size:13px}.stats{max-width:1250px;margin:12px auto;background:white;border-radius:10px;padding:12px}.hidden{display:none}@media(max-width:680px){body{padding:7px}.page{padding:5px;min-height:550px}.day{padding:4px;min-height:120px}.day .event{font-size:10px}.day strong{font-size:12px}.book{gap:2px;padding:2px}.toolbar button{padding:7px}}
</style></head><body><header><div><h1>🌿 Mein Wochenkalender</h1><small id="range"></small></div><div class="toolbar"><button id="prev">‹ Woche</button><button id="today">Heute</button><button id="next">Woche ›</button><button id="add" class="primary">+ Termin</button></div></header><main class="book"><section class="page" id="left"></section><section class="page" id="right"></section></main><section class="stats"><b>Symptomtagebuch</b><p class="muted">Tippe auf einen Tag, um Termine und deine private Symptomabfrage zu öffnen. Daten werden in diesem Browser gespeichert, nicht an einen Server übertragen. Apple-Kalender-Synchronisierung ist in diesem Web-Prototyp noch nicht vorhanden.</p><button id="export">Daten sichern (JSON)</button> <label class="muted">Sicherung einlesen <input type="file" id="import" accept="application/json"/></label><p id="count" class="muted"></p></section><div class="shade" id="shade"><div class="panel" id="panel"></div></div><script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}),names=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];let events=JSON.parse(localStorage.getItem('pw_events')||'[]'),diary=JSON.parse(localStorage.getItem('pw_diary')||'{}');let today=new Date(),monday=addDays(today,-((today.getDay()+6)%7)),chosen=iso(today);function persist(){localStorage.setItem('pw_events',JSON.stringify(events));localStorage.setItem('pw_diary',JSON.stringify(diary))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let end=addDays(monday,6);$('range').textContent=`${fmt(monday)} – ${fmt(end)} ${end.getFullYear()}`;for(let side of [0,1]){let el=$(side?'right':'left');el.innerHTML='';for(let i=side?3:0;i<(side?7:3);i++){let date=addDays(monday,i),key=iso(date),items=events.filter(e=>e.date===key).sort((a,b)=>a.time.localeCompare(b.time));let box=document.createElement('div');box.className='day';box.innerHTML=`<strong>${names[i]} · ${fmt(date)}</strong>`+items.map(e=>`<span class="event">${esc(e.time)} ${esc(e.title)}</span>`).join('');box.onclick=()=>openDay(key);el.append(box)}}$('count').textContent=`${events.length} Termine · ${Object.keys(diary).length} Tagebucheinträge`}
function modal(html){$('panel').innerHTML=html;$('shade').classList.add('open')}function close(){$('shade').classList.remove('open');render()}$('shade').onclick=e=>{if(e.target===$('shade'))close()};function openDay(date){chosen=date;let items=events.filter(e=>e.date===date).sort((a,b)=>a.time.localeCompare(b.time)),entry=diary[date]||{symptoms:[],strength:0,note:''};modal(`<div class="actions" style="justify-content:space-between"><h2>${esc(date.split('-').reverse().join('.'))}</h2><button id="close">✕</button></div><h3>Termine</h3><div id="items">${items.map(e=>`<div class="entry"><span>${esc(e.time)} · ${esc(e.title)}</span><button data-edit="${e.id}">Bearbeiten</button></div>`).join('')||'<p class="muted">Keine Termine</p>'}</div><button id="new">+ Termin für diesen Tag</button><hr><h3>Privates Symptomtagebuch</h3><p class="muted">Optional, nur für dich sichtbar.</p>${['Müdigkeit','Kopfschmerzen','Bauchschmerzen','Schlafprobleme','Stimmungsschwankungen','Übelkeit','Sonstiges'].map(s=>`<label class="check"><input type="checkbox" name="symptom" value="${s}" ${entry.symptoms.includes(s)?'checked':''}> ${s}</label>`).join('')}<div class="field"><label>Stärke (0 = keine, 4 = sehr stark)</label><select id="strength">${[0,1,2,3,4].map(n=>`<option value="${n}" ${entry.strength==n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Notizen</label><textarea id="note" rows="3">${esc(entry.note)}</textarea></div><button class="primary" id="saveDiary">Tagebuch speichern</button>`);$('close').onclick=close;$('new').onclick=()=>editEvent(null,date);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEvent(Number(b.dataset.edit),date));$('saveDiary').onclick=()=>{diary[date]={symptoms:[...document.querySelectorAll('input[name=symptom]:checked')].map(e=>e.value),strength:Number($('strength').value),note:$('note').value};persist();close()}}
function editEvent(id,date){let e=events.find(x=>x.id===id)||{date:date||iso(today),time:'09:00',title:''};modal(`<h2>${id?'Termin bearbeiten':'Neuer Termin'}</h2><div class="field"><label>Datum</label><input type="date" id="date" value="${esc(e.date)}"></div><div class="field"><label>Uhrzeit</label><input type="time" id="time" value="${esc(e.time)}"></div><div class="field"><label>Termin</label><input id="title" value="${esc(e.title)}" placeholder="Terminbezeichnung"></div><div class="actions"><button class="primary" id="save">Speichern</button>${id?'<button id="delete">Löschen</button>':''}<button id="cancel">Abbrechen</button></div>`);$('cancel').onclick=close;$('save').onclick=()=>{let title=$('title').value.trim();if(!title||!$('date').value||!$('time').value){alert('Bitte Datum, Uhrzeit und Termin eingeben.');return}let updated={id:id||Date.now(),date:$('date').value,time:$('time').value,title};events=id?events.map(x=>x.id===id?updated:x):[...events,updated];persist();close()};if(id)$('delete').onclick=()=>{if(confirm('Termin löschen?')){events=events.filter(x=>x.id!==id);persist();close()}}}
$('prev').onclick=()=>{monday=addDays(monday,-7);render()};$('next').onclick=()=>{monday=addDays(monday,7);render()};$('today').onclick=()=>{monday=addDays(new Date(),-((new Date().getDay()+6)%7));render()};$('add').onclick=()=>editEvent(null,iso(today));$('export').onclick=()=>{let blob=new Blob([JSON.stringify({events,diary},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wochenkalender-sicherung.json';a.click();URL.revokeObjectURL(a.href)};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.events)||!data.diary||typeof data.diary!=='object'||Array.isArray(data.diary))throw Error();if(!confirm('Vorhandene Daten durch die Sicherung ersetzen?'))return;events=data.events;diary=data.diary;persist();render()}catch{alert('Ungültige Sicherungsdatei.')}};render();
</script></body></html>
